backend:
  name: github
  repo: boraiks/borakosalay
  branch: master

media_folder: "images/uploads"
public_folder: "/images/uploads"

# clean up uploaded filenames (no spaces/odd characters) so asset URLs always work
media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: projects
    label: Projects
    editor:
      preview: false
    files:
      - name: projects_list
        label: All projects
        file: data/projects.json
        fields:
          - label: Projects
            name: items
            label_singular: Project
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
              - { label: Category, name: category, widget: select, options: [Software, Hardware, Concepts, Article, Contributions] }
              - label: Tags
                name: tags
                widget: relation
                collection: tags
                file: tags_list
                value_field: "items.*.name"
                search_fields: ["items.*.name"]
                display_fields: ["items.*.name"]
                multiple: true
                required: false
                options_length: 10000
              - label: Links
                name: links
                widget: list
                required: false
                label_singular: Link
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string, hint: "e.g. Source, Demo, Paper" }
                  - { label: URL, name: url, widget: string }
              - { label: "3D model (.glb / .gltf)", name: model, widget: file, required: false, hint: "Optional .glb. Shows at the top by default; to place it elsewhere, type {{model}} on its own line in the Body." }
              - { label: Body, name: body, widget: markdown, required: false, hint: "Description, images, code, embedded video" }

  - name: tags
    label: Tags
    editor:
      preview: false
    files:
      - name: tags_list
        label: All tags
        file: data/tags.json
        fields:
          - label: Tags
            name: items
            label_singular: Tag
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Color, name: color, widget: color }
