<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>borakosalay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  /* apply the saved theme before paint so there's no light/dark flash (theme-init) */
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>
  <div class="paper">

    <header class="site-head">
      <a class="back" href="index.html">&larr; back</a>
      <button class="theme-toggle" id="theme" type="button" aria-label="Toggle theme" aria-pressed="false"><span class="knob"></span></button>
    </header>

    <article class="project" id="project"></article>

  </div>

  <!-- Markdown renderer (runs in the browser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
  <script src="project.js"></script>
</body>
</html>
