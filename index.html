<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bora Koşalay</title>
<link rel="stylesheet" href="styles.css">
<script>
  /* apply the saved theme before paint so there's no light/dark flash (theme-init) */
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>
  <div class="paper">

    <header class="site-head">
      <div class="brand">
        <!-- Drop your logo at images/logo.svg (or .png and change the src below).
             If the file is missing it just hides itself, so nothing breaks. -->
        <img class="brand-logo" src="images/logo.svg" alt="" onerror="this.style.display='none'">
        <div class="identity">
          <!-- Put your name here -->
          <h1>Bora Koşalay</h1>
          <nav class="links" aria-label="Links">
            <!-- Replace the hrefs with your own links -->
            <a href="https://github.com/boraiks">github</a>
            <a href="https://www.linkedin.com/in/borakosalay/">linkedin</a>
            <a href="#">mail</a>
          </nav>
        </div>
      </div>
      <button class="theme-toggle" id="theme" type="button" aria-label="Toggle theme" aria-pressed="false"><span class="knob"></span></button>
    </header>

    <p class="intro">Projects, experiments, and short notes.</p>

    <div class="controls">
      <div class="filters">
        <div class="tagbar" id="tagbar" aria-label="Tag filter"></div>
        <div class="meta">
          <button id="sort" type="button" aria-label="Change sorting"></button>
          <button id="clear" type="button" hidden>clear</button>
          <span class="count" id="count"></span>
        </div>
      </div>
    </div>

    <main id="list"></main>

  </div>
  <script src="app.js"></script>
</body>
</html>
