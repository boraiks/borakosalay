<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeler — Adın Soyadın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="paper">

    <header class="site-head">
      <div class="identity">
        <!-- Adını buraya yaz -->
        <h1>Adın Soyadın</h1>
        <nav class="links" aria-label="Bağlantılar">
          <!-- href'leri kendi adreslerinle değiştir -->
          <a href="#">github</a>
          <a href="#">linkedin</a>
          <a href="#">mail</a>
        </nav>
      </div>
      <button class="theme-toggle" id="theme" type="button" aria-label="Temayı değiştir" aria-pressed="false"><span class="knob"></span></button>
    </header>

    <p class="intro">Boş zamanlarımda ürettiğim projeler, denemeler ve kısa yazılar.</p>

    <div class="controls">
      <div class="filters">
        <div class="tagbar" id="tagbar" aria-label="Etiket filtresi"></div>
        <div class="meta">
          <button id="sort" type="button" aria-label="Sıralamayı değiştir"></button>
          <button id="clear" type="button" hidden>temizle</button>
          <span class="count" id="count"></span>
        </div>
      </div>
    </div>

    <main id="list"></main>

  </div>
  <script src="app.js"></script>
</body>
</html>
